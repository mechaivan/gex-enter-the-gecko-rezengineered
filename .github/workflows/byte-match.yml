name: ByteMatch Report

on:
  push:
    branches: [dev/gex]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: byte-match-${{ github.ref }}
  cancel-in-progress: true

jobs:
  byte-match:
    name: Generate objdiff report
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install objdiff-cli

      - name: Generate objdiff report (EU version)
        run: |
          mkdir -p build
          objdiff-cli report generate \
            --config config/target.toml \
            --units config/match-units.toml \
            --output build/EU_report.json \
            --version EU

      - name: Upload progress report
        uses: actions/upload-artifact@v4
        with:
          name: EU_report
          path: build/EU_report.json
          retention-days: 90

      - name: Validate report
        run: |
          python -c "
import json
with open('build/EU_report.json') as f:
    r = json.load(f)
print('Report keys:', list(r.keys()))
if 'functions' in r:
    print(f'Functions: {len(r[\"functions\"])}')
if 'matched_functions' in r:
    print(f'Matched: {r[\"matched_functions\"]}')
if 'total_functions' in r:
    print(f'Total: {r[\"total_functions\"]}')
if 'matched_code_percent' in r:
    print(f'Code %: {r[\"matched_code_percent\"]}%')
"