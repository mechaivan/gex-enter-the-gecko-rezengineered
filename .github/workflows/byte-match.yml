name: ByteMatch Report

on:
  push:
    branches: [dev/gex]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: byte-match-${{ github.ref }}
  cancel-in-progress: true

jobs:
  byte-match:
    name: Generate objdiff report
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download objdiff v0.14.0 Linux x86_64
        run: |
          set -e
          URL="https://github.com/encounter/objdiff/releases/download/v0.14.0/objdiff-v0.14.0-x86_64-unknown-linux-gnu.tar.gz"
          echo "Downloading from: $URL"
          curl -L -f -o objdiff.tar.gz "$URL"
          tar -xzf objdiff.tar.gz
          ls -la
          chmod +x objdiff
          ./objdiff --version

      - name: Generate objdiff report (EU version)
        run: |
          mkdir -p build
          ./objdiff report generate \
            --config config/target.toml \
            --units config/match-units.toml \
            --output build/EU_report.json \
            --version EU

      - name: Upload progress report
        uses: actions/upload-artifact@v4
        with:
          name: EU_report
          path: build/EU_report.json
          retention-days: 90

      - name: Validate report
        run: |
          python -c "
import json
with open('build/EU_report.json') as f:
    r = json.load(f)
print('Report keys:', list(r.keys()))
if 'functions' in r:
    print(f'Functions: {len(r[\"functions\"])}')
if 'matched_functions' in r:
    print(f'Matched: {r[\"matched_functions\"]}')
if 'total_functions' in r:
    print(f'Total: {r[\"total_functions\"]}')
if 'matched_code_percent' in r:
    print(f'Code %: {r[\"matched_code_percent\"]}%')
"