name: ByteMatch Report

on:
  push:
    branches: [dev/gex]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: byte-match-${{ github.ref }}
  cancel-in-progress: true

jobs:
  byte-match:
    name: Generate objdiff report
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get objdiff v0.14.0 Linux asset URL
        id: get-objdiff-url
        run: |
          RELEASE_INFO=$(curl -s https://api.github.com/repos/encounter/objdiff/releases/tags/v0.14.0)
          ASSET_URL=$(echo "$RELEASE_INFO" | grep -o '"browser_download_url": "[^"]*linux[^"]*\.tar\.gz"' | head -1 | cut -d'"' -f4)
          if [ -z "$ASSET_URL" ]; then
            echo "No Linux asset found in release"
            exit 1
          fi
          echo "ASSET_URL=$ASSET_URL" >> $GITHUB_OUTPUT
          echo "Using URL: $ASSET_URL"

      - name: Download objdiff
        run: |
          curl -L -f -o objdiff.tar.gz "${{ steps.get-objdiff-url.outputs.ASSET_URL }}"
          tar -xzf objdiff.tar.gz
          ls -la
          OBJDIFF_BIN=$(find . -name "objdiff" -type f -executable | head -1)
          if [ -z "$OBJDIFF_BIN" ]; then
            echo "objdiff binary not found in archive"
            exit 1
          fi
          cp "$OBJDIFF_BIN" ./objdiff
          chmod +x ./objdiff
          ./objdiff --version

      - name: Generate objdiff report (EU version)
        run: |
          mkdir -p build
          ./objdiff report generate \
            --config config/target.toml \
            --units config/match-units.toml \
            --output build/EU_report.json \
            --version EU

      - name: Upload progress report
        uses: actions/upload-artifact@v4
        with:
          name: EU_report
          path: build/EU_report.json
          retention-days: 90

      - name: Validate report
        run: |
          python -c "
import json
with open('build/EU_report.json') as f:
    r = json.load(f)
print('Report keys:', list(r.keys()))
if 'functions' in r:
    print(f'Functions: {len(r[\"functions\"])}')
if 'matched_functions' in r:
    print(f'Matched: {r[\"matched_functions\"]}')
if 'total_functions' in r:
    print(f'Total: {r[\"total_functions\"]}')
if 'matched_code_percent' in r:
    print(f'Code %: {r[\"matched_code_percent\"]}%')
"