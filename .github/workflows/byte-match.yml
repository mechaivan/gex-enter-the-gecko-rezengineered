name: ByteMatch Report

on:
  push:
    branches: [dev/gex]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: byte-match-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    name: Publish EU progress report
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The report is generated from the original executable, which is never committed
      # (it is proprietary). Generation happens locally; this job validates the committed
      # file and hands it to ByteMatch, so the run cannot fail on a download or a build.
      - name: Validate report
        run: node tools/bytematch-report.mjs --check

      - name: Upload progress report
        uses: actions/upload-artifact@v4
        with:
          name: EU_report
          path: report/EU/report.json
          if-no-files-found: error
          retention-days: 90
