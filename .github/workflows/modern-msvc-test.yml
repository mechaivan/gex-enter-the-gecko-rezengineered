name: Modern MSVC Test (cl.exe from VS 2022)

on:
  workflow_dispatch:
  push:
    branches: [dev/gex]
    paths:
      - 'tools/msvc-test.c'
      - '.github/workflows/modern-msvc-test.yml'

permissions:
  contents: read

jobs:
  test-compile:
    name: Compile test .obj with modern cl.exe
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find VS 2022 vcvarsall
        id: find_vcvars
        run: |
          echo === Finding VS 2022 vcvarsall ===
          for /d %%d in ("C:\Program Files\Microsoft Visual Studio\2022\*") do (
            if exist "%%d\VC\Auxiliary\Build\vcvarsall.bat" (
              echo Found: %%d\VC\Auxiliary\Build\vcvarsall.bat
              echo "vcvarsall=%%d\VC\Auxiliary\Build\vcvarsall.bat" >> %GITHUB_OUTPUT%
              goto :found
            )
          )
          echo vcvarsall not found
          exit 1
          :found

      - name: Compile, verify, copy and upload test .obj
        env:
          VCVARSALL: ${{ steps.find_vcvars.outputs.vcvarsall }}
        run: |
          echo === Diagnostics ===
          echo VCVARSALL: %VCVARSALL%
          echo.
          echo Calling vcvarsall...
          call "%VCVARSALL%" x86
          echo vcvarsall returned %ERRORLEVEL%
          echo.
          echo PATH now:
          echo %PATH%
          echo.
          echo === Compiler version ===
          cl.exe 2>&1
          echo cl.exe returned %ERRORLEVEL%
          echo.
          echo === Linker version ===
          link.exe 2>&1
          echo link.exe returned %ERRORLEVEL%
          echo.
          echo === Compiling ===
          cl.exe /nologo /c /Od /Ob0 /Oi- /Oy- /Gd /MT /Gy /Z7 /Fo msvc-test.obj tools/msvc-test.c
          echo cl.exe returned %ERRORLEVEL%
          echo.
          echo === Verifying .obj ===
          dir msvc-test.obj
          powershell -Command "$bytes = [System.IO.File]::ReadAllBytes('msvc-test.obj'); $machine = [BitConverter]::ToUInt16($bytes, 0x4); Write-Host 'COFF machine: 0x{0:X4} (expect 0x014C = i386)' -f $machine; $sections = [BitConverter]::ToUInt16($bytes, 0x6); Write-Host 'Number of sections: ' + $sections"
          echo.
          echo === Copy to runner.temp ===
          copy msvc-test.obj "%RUNNER_TEMP%\msvc-test.obj"
          echo copy returned %ERRORLEVEL%
          dir "%RUNNER_TEMP%\msvc-test.obj"
          echo.
          echo File ready at: "%RUNNER_TEMP%\msvc-test.obj"

      - name: Upload test object
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modern-msvc-test-obj
          path: ${{ runner.temp }}\msvc-test.obj
          if-no-files-found: error
          retention-days: 7