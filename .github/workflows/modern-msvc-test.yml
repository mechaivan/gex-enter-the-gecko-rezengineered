name: Modern MSVC Test (cl.exe from VS 2022)

on:
  workflow_dispatch:
  push:
    branches: [dev/gex]
    paths:
      - 'tools/msvc-test.c'
      - '.github/workflows/modern-msvc-test.yml'

permissions:
  contents: read

jobs:
  test-compile:
    name: Compile test .obj with modern cl.exe
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile, verify, copy and upload test .obj
        shell: pwsh
        run: |
          $vcvars = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat"
          $repoRoot = (Get-Location).Path
          $objPath = Join-Path $repoRoot "msvc-test.obj"
          $tempObj = Join-Path $env:RUNNER_TEMP "msvc-test.obj"

          Write-Host "=== Diagnostics ==="
          Write-Host "Repo root: $repoRoot"
          Write-Host "vcvarsall: $vcvars"
          Write-Host "Target obj: $objPath"
          Write-Host "Temp obj: $tempObj"

          # Check VS installation
          if (-not (Test-Path $vcvars)) {
            Write-Error "vcvarsall.bat not found at $vcvars"
            exit 1
          }

          # Call vcvarsall and capture environment
          Write-Host "=== Calling vcvarsall x86 ==="
          & cmd /c "`"$vcvars`" x86 && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              $env:$matches[1] = $matches[2]
            }
          }
          Write-Host "vcvarsall applied"

          # Verify compiler
          Write-Host "=== Compiler version ==="
          $clOut = & cl.exe 2>&1
          $clOut | Select-String "Version" | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) { Write-Warning "cl.exe returned $LASTEXITCODE" }

          Write-Host "=== Linker version ==="
          $linkOut = & link.exe 2>&1
          $linkOut | Select-String "Version" | ForEach-Object { Write-Host $_ }

          # Compile
          Write-Host "=== Compiling ==="
          $src = Join-Path $repoRoot "tools\msvc-test.c"
          & cl.exe /nologo /c /Od /Ob0 /Oi- /Oy- /Gd /MT /Gy /Z7 /Fo $objPath $src
          if ($LASTEXITCODE -ne 0) { Write-Error "cl.exe failed with $LASTEXITCODE"; exit $LASTEXITCODE }
          Write-Host "cl.exe succeeded"

          # Verify .obj
          Write-Host "=== Verifying .obj ==="
          if (-not (Test-Path $objPath)) { Write-Error "Object file not found at $objPath"; exit 1 }
          $bytes = [System.IO.File]::ReadAllBytes($objPath)
          $machine = [BitConverter]::ToUInt16($bytes, 4)
          $sections = [BitConverter]::ToUInt16($bytes, 6)
          Write-Host "COFF machine: 0x$($machine.ToString('X4')) (expect 0x014C = i386)"
          Write-Host "Number of sections: $sections"
          Write-Host "File size: $($bytes.Length) bytes"

          # Copy to runner.temp
          Write-Host "=== Copy to runner.temp ==="
          Copy-Item $objPath $tempObj -Force
          if (-not (Test-Path $tempObj)) { Write-Error "Copy failed"; exit 1 }
          Write-Host "Copied to $tempObj"

      - name: Upload test object
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modern-msvc-test-obj
          path: ${{ runner.temp }}/msvc-test.obj
          if-no-files-found: error
          retention-days: 7