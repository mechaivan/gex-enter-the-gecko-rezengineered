name: Modern MSVC Test (cl.exe from VS 2022)

on:
  workflow_dispatch:
  push:
    branches: [dev/gex]
    paths:
      - 'tools/msvc-test.c'
      - '.github/workflows/modern-msvc-test.yml'

permissions:
  contents: read

jobs:
  test-compile:
    name: Diagnose VS installation
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List VS installations via vswhere
        shell: pwsh
        run: |
          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            Write-Host "=== vswhere output ==="
            & $vswhere -legacy -format json | ConvertFrom-Json | ForEach-Object {
              Write-Host "  Version: $($_.version), Path: $($_.installationPath), Product: $($_.productName)"
            }
            Write-Host ""
            Write-Host "=== Latest with C++ tools ==="
            $vcvars = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if ($vcvars) {
              Write-Host "Installation path: $vcvars"
              $vcvars = Join-Path $vcvars "VC\Auxiliary\Build\vcvarsall.bat"
              if (Test-Path $vcvars) { Write-Host "vcvarsall: $vcvars" }
            }
          } else {
            Write-Warning "vswhere not found"
          }

      - name: Check standard VS locations
        shell: pwsh
        run: |
          Write-Host "=== Checking standard locations ==="
          $candidates = @(
            "C:\Program Files\Microsoft Visual Studio\2022\Enterprise",
            "C:\Program Files\Microsoft Visual Studio\2022\Professional",
            "C:\Program Files\Microsoft Visual Studio\2022\Community",
            "C:\Program Files\Microsoft Visual Studio\2022\BuildTools",
            "C:\Program Files (x86)\Microsoft Visual Studio\2019\Enterprise",
            "C:\Program Files (x86)\Microsoft Visual Studio\2019\Professional",
            "C:\Program Files (x86)\Microsoft Visual Studio\2019\Community"
          )
          foreach ($base in $candidates) {
            $vcvars = Join-Path $base "VC\Auxiliary\Build\vcvarsall.bat"
            if (Test-Path $vcvars) {
              Write-Host "FOUND: $vcvars"
            } else {
              Write-Host "missing: $vcvars"
            }
          }

      - name: Check PATH for cl.exe
        shell: pwsh
        run: |
          Write-Host "=== PATH entries containing Visual Studio ==="
          $env:PATH -split ';' | Where-Object { $_ -like '*Visual Studio*' -or $_ -like '*VC*' } | ForEach-Object { Write-Host "  $_" }
          Write-Host ""
          Write-Host "=== cl.exe in PATH? ==="
          $cl = Get-Command cl.exe -ErrorAction SilentlyContinue
          if ($cl) { Write-Host "FOUND: $($cl.Source)" } else { Write-Host "NOT in PATH" }