name: Modern MSVC Test (cl.exe from VS 2022)

on:
  workflow_dispatch:
  push:
    branches: [dev/gex]
    paths:
      - 'tools/msvc-test.c'
      - '.github/workflows/modern-msvc-test.yml'

permissions:
  contents: read

jobs:
  test-compile:
    name: Diagnose VS installation
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List VS installations via vswhere
        id: vswhere
        shell: pwsh
        run: |
          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          $out = @()
          if (Test-Path $vswhere) {
            $out += "=== vswhere output ==="
            $installations = & $vswhere -legacy -format json | ConvertFrom-Json
            foreach ($inst in $installations) {
              $out += "  Version: $($inst.version), Path: $($inst.installationPath), Product: $($inst.productName)"
            }
            $out += ""
            $out += "=== Latest with C++ tools ==="
            $vcvars = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if ($vcvars) {
              $out += "Installation path: $vcvars"
              $vcvarsPath = Join-Path $vcvars "VC\Auxiliary\Build\vcvarsall.bat"
              if (Test-Path $vcvarsPath) { $out += "vcvarsall: $vcvarsPath" }
            }
          } else {
            $out += "vswhere not found"
          }
          $outContent = $out -join "`n"
          Write-Host $outContent
          $outContent | Out-File -FilePath "vswhere-diagnostic.txt" -Encoding utf8

      - name: Check standard VS locations
        id: locations
        shell: pwsh
        run: |
          $out = @()
          $out += "=== Checking standard locations ==="
          $candidates = @(
            "C:\Program Files\Microsoft Visual Studio\2022\Enterprise",
            "C:\Program Files\Microsoft Visual Studio\2022\Professional",
            "C:\Program Files\Microsoft Visual Studio\2022\Community",
            "C:\Program Files\Microsoft Visual Studio\2022\BuildTools",
            "C:\Program Files (x86)\Microsoft Visual Studio\2019\Enterprise",
            "C:\Program Files (x86)\Microsoft Visual Studio\2019\Professional",
            "C:\Program Files (x86)\Microsoft Visual Studio\2019\Community"
          )
          foreach ($base in $candidates) {
            $vcvars = Join-Path $base "VC\Auxiliary\Build\vcvarsall.bat"
            if (Test-Path $vcvars) {
              $out += "FOUND: $vcvars"
            } else {
              $out += "missing: $vcvars"
            }
          }
          $outContent = $out -join "`n"
          Write-Host $outContent
          $outContent | Out-File -FilePath "locations-diagnostic.txt" -Encoding utf8

      - name: Check PATH for cl.exe
        id: pathcheck
        shell: pwsh
        run: |
          $out = @()
          $out += "=== PATH entries containing Visual Studio ==="
          $env:PATH -split ';' | Where-Object { $_ -like '*Visual Studio*' -or $_ -like '*VC*' } | ForEach-Object { $out += "  $_" }
          $out += ""
          $out += "=== cl.exe in PATH? ==="
          $cl = Get-Command cl.exe -ErrorAction SilentlyContinue
          if ($cl) { $out += "FOUND: $($cl.Source)" } else { $out += "NOT in PATH" }
          $outContent = $out -join "`n"
          Write-Host $outContent
          $outContent | Out-File -FilePath "path-diagnostic.txt" -Encoding utf8

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vs-diagnostics
          path: |
            vswhere-diagnostic.txt
            locations-diagnostic.txt
            path-diagnostic.txt
          retention-days: 7