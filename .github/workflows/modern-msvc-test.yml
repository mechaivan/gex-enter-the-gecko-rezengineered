name: Modern MSVC Test (cl.exe from VS 2022)

on:
  workflow_dispatch:
  push:
    branches: [dev/gex]
    paths:
      - 'tools/msvc-test.c'
      - '.github/workflows/modern-msvc-test.yml'

permissions:
  contents: read

jobs:
  test-compile:
    name: Compile test .obj with modern cl.exe
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup VS 2022 Developer Command Prompt
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '17.0'

      - name: Verify compiler
        run: |
          cl.exe 2>&1 | findstr /R "Version"
          link.exe 2>&1 | findstr /R "Version"
        shell: cmd

      - name: Compile test .obj (flags compatibles matching)
        run: |
          cl.exe /nologo /c /Od /Ob0 /Oi- /Oy- /Gd /MT /Gy /Z7 /Fo msvc-test.obj tools/msvc-test.c
        shell: cmd

      - name: Verify .obj produced
        run: |
          dir msvc-test.obj
          $bytes = [System.IO.File]::ReadAllBytes("msvc-test.obj")
          $machine = [BitConverter]::ToUInt16($bytes, 0x4)
          Write-Host "COFF machine: 0x$($machine.ToString('X4')) (expect 0x014C = i386)"
          # Check sections
          $sections = [BitConverter]::ToUInt16($bytes, 0x6)
          Write-Host "Number of sections: $sections"
        shell: pwsh

      - name: Upload test object
        uses: actions/upload-artifact@v4
        with:
          name: modern-msvc-test-obj
          path: msvc-test.obj
          retention-days: 7