name: Modern MSVC Test (cl.exe from VS 2022)

on:
  workflow_dispatch:
  push:
    branches: [dev/gex]
    paths:
      - 'tools/msvc-test.c'
      - '.github/workflows/modern-msvc-test.yml'

permissions:
  contents: read

jobs:
  test-compile:
    name: Compile test .obj with modern cl.exe
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Diagnose workspace
        run: |
          echo === Workspace diagnosis ===
          echo Current dir: %CD%
          echo GITHUB_WORKSPACE: %GITHUB_WORKSPACE%
          dir /b
          echo.
          echo Checking tools/msvc-test.c:
          if exist tools\msvc-test.c (echo FOUND) else (echo NOT FOUND)
          echo.
          echo Checking VS installation:
          dir "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat"

      - name: Compile, verify, copy and upload test .obj
        run: |
          echo === Diagnostics ===
          echo VS dirs:
          dir "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\"
          echo.
          echo Calling vcvarsall...
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x86
          echo vcvarsall returned %ERRORLEVEL%
          echo.
          echo PATH now:
          echo %PATH%
          echo.
          echo === Compiler version ===
          cl.exe 2>&1
          echo cl.exe returned %ERRORLEVEL%
          echo.
          echo === Linker version ===
          link.exe 2>&1
          echo link.exe returned %ERRORLEVEL%
          echo.
          echo === Compiling ===
          cl.exe /nologo /c /Od /Ob0 /Oi- /Oy- /Gd /MT /Gy /Z7 /Fo msvc-test.obj tools/msvc-test.c
          echo cl.exe returned %ERRORLEVEL%
          echo.
          echo === Verifying .obj ===
          dir msvc-test.obj
          powershell -Command "$bytes = [System.IO.File]::ReadAllBytes('msvc-test.obj'); $machine = [BitConverter]::ToUInt16($bytes, 0x4); Write-Host 'COFF machine: 0x{0:X4} (expect 0x014C = i386)' -f $machine; $sections = [BitConverter]::ToUInt16($bytes, 0x6); Write-Host 'Number of sections: ' + $sections"
          echo.
          echo === Copy to runner.temp ===
          copy msvc-test.obj "%RUNNER_TEMP%\msvc-test.obj"
          echo copy returned %ERRORLEVEL%
          dir "%RUNNER_TEMP%\msvc-test.obj"
          echo.
          echo File ready at: "%RUNNER_TEMP%\msvc-test.obj"

      - name: Upload test object
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modern-msvc-test-obj
          path: ${{ runner.temp }}\msvc-test.obj
          if-no-files-found: error
          retention-days: 7